name: Deploy Staging (develop)

# Re-applies migrations after a merge to develop. `supabase db push` skips what
# a labelled PR already applied, so this only catches what was merged without
# a staging deploy. Edge functions are handled by deploy-staging-edge-functions.yml.

on:
  push:
    branches: [develop]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/_db_migrate.yml"

permissions:
  contents: read

concurrency:
  group: deploy-staging-develop
  cancel-in-progress: false

jobs:
  migrate:
    uses: ./.github/workflows/_db_migrate.yml
    with:
      target: staging
    secrets: inherit
