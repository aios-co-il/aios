name: Deploy Staging

# PRs that change supabase/migrations/** or supabase/functions/** must hold the
# `staging` label (one PR at a time, see staging-lock.yml). The label deploys the
# PR's migrations and edge functions to the Staging project before merge.
# develop -> main release PRs are exempt: Staging already runs develop.

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes an in-flight run for the same PR.
concurrency:
  group: deploy-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve changes
    if: >
      github.event_name != 'pull_request' ||
      !(github.head_ref == 'develop' && github.base_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations || 'true' }}
      functions: ${{ steps.filter.outputs.functions || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'
            functions:
              - 'supabase/functions/**'
              - 'supabase/config.toml'
              - 'scripts/*edge*'
              - 'scripts/staging-only-functions.json'

  gate:
    name: Require staging label
    needs: resolve
    if: >
      github.event_name == 'pull_request' &&
      (needs.resolve.outputs.migrations == 'true' || needs.resolve.outputs.functions == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Fail if this PR changes migrations or edge functions without the staging label
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'staging') }}
        run: |
          echo "::error::This PR changes supabase/migrations/** or supabase/functions/** but does not hold the 'staging' label. Add the 'staging' label to acquire the staging lock and deploy it to Staging before this can merge."
          exit 1

  check-lock:
    name: Verify staging lock ownership
    needs: resolve
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'staging')
    runs-on: ubuntu-latest
    outputs:
      is_holder: ${{ steps.check.outputs.is_holder }}
    steps:
      # A pull_request run already executes the PR's own workflow file, so the
      # script comes from the PR checkout too.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Confirm this PR is the only open PR holding the staging label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # Live state, not the event's labels: a rerun keeps the original payload, so a
        # released label or a closed PR must be caught here.
        run: .github/scripts/check-staging-holder.sh "$PR" >> "$GITHUB_OUTPUT"

      - name: Fail when changes would deploy without holding the lock
        if: steps.check.outputs.is_holder != 'true' && (needs.resolve.outputs.migrations == 'true' || needs.resolve.outputs.functions == 'true')
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "::error::$REASON. This PR changes migrations or edge functions, so nothing will be deployed until it is open and the only holder."
          exit 1

  migrate:
    needs: [resolve, gate, check-lock]
    if: >
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.migrations == 'true' &&
      (github.event_name != 'pull_request' || (needs.check-lock.result == 'success' && needs.check-lock.outputs.is_holder == 'true'))
    uses: ./.github/workflows/_db_migrate.yml
    with:
      target: staging
    secrets: inherit

  types:
    needs: migrate
    if: always() && needs.migrate.result == 'success'
    uses: ./.github/workflows/_check_types.yml
    secrets: inherit

  functions:
    # Functions can depend on the migrations, so a failed migration blocks them.
    needs: [resolve, gate, check-lock, migrate]
    if: >
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.functions == 'true' &&
      needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled' &&
      (github.event_name != 'pull_request' || (needs.check-lock.result == 'success' && needs.check-lock.outputs.is_holder == 'true'))
    uses: ./.github/workflows/deploy-edge-reusable.yml
    permissions:
      contents: write
    with:
      environment: staging
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'branch' }}
      base_ref: ${{ github.base_ref || 'develop' }}
      pr_number: ${{ github.event.pull_request.number || '' }}
    secrets: inherit

  result:
    name: Staging deploy result
    # Aggregate required check: the individual jobs can be skipped, but a failure or
    # cancellation anywhere (including a skipped-because-upstream-failed path) fails it.
    needs: [resolve, gate, check-lock, migrate, types, functions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail on any failed or cancelled job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled) echo "::error::A required Staging deploy job ended as '$r'."; exit 1 ;;
            esac
          done

  comment:
    name: Update PR comment
    needs: [resolve, gate, check-lock, migrate, types, functions]
    if: >
      always() &&
      needs.resolve.result == 'success' &&
      github.event_name == 'pull_request' &&
      (needs.resolve.outputs.migrations == 'true' || needs.resolve.outputs.functions == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post combined status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET: staging
          MIGRATE_RESULT: ${{ needs.migrate.outputs.migrate_status || needs.migrate.result }}
          FUNCTIONS_RESULT: ${{ needs.functions.result }}
          TYPES_RESULT: ${{ needs.types.result }}
          MIGRATIONS_CHANGED: ${{ needs.resolve.outputs.migrations }}
          FUNCTIONS_CHANGED: ${{ needs.resolve.outputs.functions }}
          # Why jobs were skipped: label | lock | upstream
          SKIP_REASON: ${{ needs.gate.result == 'failure' && 'label' || (needs.check-lock.result == 'failure' || needs.check-lock.outputs.is_holder == 'false') && 'lock' || 'upstream' }}
        run: .github/scripts/post-deploy-comment.sh
