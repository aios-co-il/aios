name: Mirror live business data to Staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-business-data-mirror
  cancel-in-progress: false
jobs:
  mirror:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PRODUCTION_REF: ${{ vars.PROD_PROJECT_REF }}
      STAGING_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mirror regression tests
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror.py'
      - name: Reconcile changed customer and report rows
        run: python3 scripts/sync-staging-data.py --apply
