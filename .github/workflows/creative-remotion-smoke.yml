name: Creative Remotion smoke render
on:
  push:
    branches: [feature/creative-video-production-792]
    paths:
      - "workers/creative-video/remotion/**"
      - ".github/workflows/creative-remotion-smoke.yml"
  pull_request:
    paths:
      - "workers/creative-video/remotion/**"
      - ".github/workflows/creative-remotion-smoke.yml"
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/creative-video/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile composition
        run: npx remotion compositions src/index.ts --log=error
      - name: Render low-resolution smoke test
        run: npx remotion render src/index.ts CarmenVideo /tmp/carmen-smoke.mp4 --scale=0.25 --frames=0-89 --codec=h264 --concurrency=2 --log=error
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
        working-directory: .
      - name: Render full composition
        run: npx remotion render src/index.ts CarmenVideo /tmp/carmen-full.mp4 --scale=0.5 --codec=h264 --concurrency=2 --log=error
      - name: Render manifest-driven job
        run: node render-job.mjs fixtures/demo-manifest.json /tmp/carmen-job.mp4
      - name: Verify manifest-driven job
        run: |
          test -s /tmp/carmen-job.mp4
          test -s /tmp/carmen-job.mp4.json
          ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames,width,height -of default=noprint_wrappers=1 /tmp/carmen-job.mp4
        working-directory: .
      - name: Render a Workshop film (v3, looped bed, motion captions, skin switch)
        # fixtures/workshop-manifest.json is what render-worker's buildWorkshopManifest makes of a
        # two-scene trailer: a 2 s music track laid five times across the 6.5 s film.
        run: |
          dir=$(mktemp -d)
          cp fixtures/workshop-manifest.json "$dir/"
          gen() { ffmpeg -hide_banner -loglevel error -y -f lavfi "$@"; }
          gen -i color=c=0x123456:s=640x360:d=1 -frames:v 1 "$dir/still-0.png"
          gen -i color=c=0x654321:s=640x360:d=1 -frames:v 1 "$dir/still-1.png"
          gen -i sine=frequency=330:duration=2 -af volume=4 "$dir/music.wav"
          gen -i sine=frequency=220:duration=3.5 -af volume=2 "$dir/narration.wav"
          node render-job.mjs "$dir/workshop-manifest.json" /tmp/carmen-workshop.mp4
      - name: Verify the Workshop film has its music to the end
        run: |
          frames=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nokey=1:noprint_wrappers=1 /tmp/carmen-workshop.mp4)
          test "$frames" = 195
          # On the end card (from 4 s, before the closing fade at 5 s) nobody speaks, so the
          # trailer bed is up: about -16.5 dB with the manifest's loops. Remotion's own `loop`
          # restarts the volume envelope with each pass and plays it ducked (about -30 dB).
          mean=$(ffmpeg -hide_banner -ss 4 -t 0.8 -i /tmp/carmen-workshop.mp4 -af volumedetect -f null - 2>&1 | sed -n 's/.*mean_volume: \(-\{0,1\}[0-9.]*\) dB.*/\1/p')
          echo "end card mean volume: $mean dB"
          awk -v m="$mean" 'BEGIN { exit !(m != "" && m > -22) }'
        working-directory: .
      - name: Verify full video duration
        run: |
          test -s /tmp/carmen-full.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of default=noprint_wrappers=1 /tmp/carmen-full.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/carmen-full.mp4
        working-directory: .
      - name: Verify MP4 has video frames
        run: |
          test -s /tmp/carmen-smoke.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of default=noprint_wrappers=1 /tmp/carmen-smoke.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: carmen-remotion-smoke
          path: /tmp/carmen-smoke.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: carmen-remotion-full
          path: /tmp/carmen-full.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: carmen-workshop-film
          path: /tmp/carmen-workshop.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: carmen-manifest-job
          path: |
            /tmp/carmen-job.mp4
            /tmp/carmen-job.mp4.json
