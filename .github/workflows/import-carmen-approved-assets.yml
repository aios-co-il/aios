name: Import approved Carmen artwork
on:
  push:
    branches: [feature/carmen-approved-visual-hero]
    paths: [.github/workflows/import-carmen-approved-assets.yml]
permissions:
  contents: write
concurrency:
  group: carmen-approved-artwork-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'davidcastelnuovo/aios' && github.ref == 'refs/heads/feature/carmen-approved-visual-hero'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carmen-approved-visual-hero
          fetch-depth: 1
      - name: Install image exporter
        run: python -m pip install Pillow==11.3.0
      - name: Import exact approved images and create lossless web assets
        shell: python
        run: |
          import hashlib, io, json, pathlib, urllib.request
          from PIL import Image
          assets = {
            'wordmark': {
              'url': 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-d8f0-81f4-9aed-92b2bf474372/raw?se=2026-10-13T10%3A39%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=f1c15f7c-102c-5a5f-9f69-3e0bd85c491e&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T04%3A43%3A42Z&ske=2026-10-14T04%3A43%3A42Z&sks=b&skv=2026-02-06&sig=Kyfde1m9qxBmj6QUIo/%2BVP4xgbAcqTE7qAlIOBdKeMI%3D',
              'sha256': 'f8e25e8d4f20b6c5e5e83ad309f97b09797581fc21a42550cc0dab1fa505aa9c',
              'sourceFileId': 'file_0000000022948246bad6fd221ec52c21',
              'crop': [39, 195, 1619, 877]
            },
            'symbol': {
              'url': 'https://sdmntprukwest.oaiusercontent.com/files/00000000-5564-8243-bc1d-0a57dcc1a23d/raw?se=2026-10-13T10%3A40%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=da1c187d-a597-5ba6-a57e-4a0e24405a2a&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T05%3A21%3A52Z&ske=2026-10-14T05%3A21%3A52Z&sks=b&skv=2026-02-06&sig=G91hH7Cf9nTsQi9Oxm7dWNr1NhWFzq0xl9ACRNeD3y4%3D',
              'sha256': '080a5964dd8e299f5fcf537485ab161dd3d3dd45b01bdffd611c3c074ef82f6d',
              'sourceFileId': 'file_000000006f3881f4b33ab273cc47c752',
              'crop': [63, 109, 1216, 1150]
            }
          }
          target = pathlib.Path('public/brand/carmen')
          sources = pathlib.Path('design/brand/carmen/approved-soft-sources')
          target.mkdir(parents=True, exist_ok=True)
          sources.mkdir(parents=True, exist_ok=True)
          records = {}
          for key, spec in assets.items():
            original = sources / (key + '-soft-source.png')
            data = original.read_bytes() if original.exists() else urllib.request.urlopen(spec['url'], timeout=45).read()
            assert hashlib.sha256(data).hexdigest() == spec['sha256'], key + ': source mismatch'
            im = Image.open(io.BytesIO(data))
            assert im.mode == 'RGBA', key + ': missing transparency'
            original.write_bytes(data)
            cropped = im.crop(spec['crop'])
            web = Image.new('RGBA', (cropped.width + 32, cropped.height + 32), (0, 0, 0, 0))
            web.paste(cropped, (16, 16))
            web.save(target / (key + '-soft.png'), optimize=True)
            web.save(target / (key + '-soft.webp'), 'WEBP', lossless=True, method=6, exact=True)
            decoded = Image.open(target / (key + '-soft.webp')).convert('RGBA')
            assert decoded.tobytes() == web.tobytes(), key + ': lossless roundtrip failed'
            records[key] = {'png': '/brand/carmen/' + key + '-soft.png', 'webp': '/brand/carmen/' + key + '-soft.webp', 'width': web.width, 'height': web.height, 'sourceSha256': spec['sha256'], 'sourceFileId': spec['sourceFileId'], 'sourceCrop': spec['crop'], 'padding': 16, 'redrawn': False}
            print(key, web.size, (target / (key + '-soft.webp')).stat().st_size)
          manifest = {'brand': 'Carmen Marketing OS', 'variant': 'approved-soft', 'status': 'installed', 'assets': records, 'note': 'Original approved raster artwork; no vector recreation. Original PNG bytes archived under design/brand/carmen/approved-soft-sources. Only invisible margins trimmed and transparent padding added.'}
          (target / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
      - name: Commit assets only to the preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/carmen design/brand/carmen/approved-soft-sources
          if git diff --cached --quiet; then exit 0; fi
          git -c core.hooksPath=/dev/null commit -m 'brand: install original approved soft Carmen wordmark and symbol'
          git push origin HEAD:refs/heads/feature/carmen-approved-visual-hero
