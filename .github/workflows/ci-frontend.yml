name: CI — frontend build

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOOTSTRAP_TYPECHECK_SHA: ${{ secrets.TYPESCRIPT_GATE_BOOTSTRAP_SHA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.source_sha || github.sha }}
          path: trusted-base
          persist-credentials: false

      - name: Validate optional reviewed bootstrap revision
        run: |
          if [ -n "$BOOTSTRAP_TYPECHECK_SHA" ] && ! [[ "$BOOTSTRAP_TYPECHECK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'TYPESCRIPT_GATE_BOOTSTRAP_SHA must be a reviewed, full commit SHA.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        if: env.BOOTSTRAP_TYPECHECK_SHA != ''
        with:
          ref: ${{ env.BOOTSTRAP_TYPECHECK_SHA }}
          path: trusted-bootstrap
          persist-credentials: false

      - name: Prepare isolated trusted checker
        id: checker
        run: |
          policy_source="$GITHUB_WORKSPACE/trusted-base"
          if [ -n "$BOOTSTRAP_TYPECHECK_SHA" ]; then
            policy_source="$GITHUB_WORKSPACE/trusted-bootstrap"
          fi
          if [ ! -f "$policy_source/scripts/typecheck-policy.mjs" ] || [ ! -f "$policy_source/scripts/typecheck.mjs" ]; then
            echo 'Trusted checker missing: review a tooling commit and set TYPESCRIPT_GATE_BOOTSTRAP_SHA; see docs/agents/typecheck.md.' >&2
            exit 1
          fi
          checker_directory="$RUNNER_TEMP/trusted-typecheck"
          mkdir -p "$checker_directory/scripts"
          cp "$policy_source/scripts/typecheck.mjs" "$policy_source/scripts/typecheck-policy.mjs" "$checker_directory/scripts/"
          cp "$policy_source/package.json" "$policy_source/pnpm-lock.yaml" "$checker_directory/"
          echo "directory=$checker_directory" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install trusted compiler dependencies without hooks
        working-directory: ${{ steps.checker.outputs.directory }}
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: project
          persist-credentials: false
      - name: Install project dependencies as type-check input only
        working-directory: project
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Full frontend TypeScript gate using trusted checker
        env:
          CHECKER_DIRECTORY: ${{ steps.checker.outputs.directory }}
        working-directory: project
        run: node "$CHECKER_DIRECTORY/scripts/typecheck.mjs" --project "$PWD"

  baseline-review:
    if: github.event.pull_request && contains(fromJSON('["main", "develop"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOOTSTRAP_TYPECHECK_SHA: ${{ secrets.TYPESCRIPT_GATE_BOOTSTRAP_SHA }}
    steps:
      # This job never checks out, installs, imports, or executes PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Validate optional reviewed bootstrap revision
        run: |
          if [ -n "$BOOTSTRAP_TYPECHECK_SHA" ] && ! [[ "$BOOTSTRAP_TYPECHECK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'TYPESCRIPT_GATE_BOOTSTRAP_SHA must be a reviewed, full commit SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: env.BOOTSTRAP_TYPECHECK_SHA != ''
        with:
          ref: ${{ env.BOOTSTRAP_TYPECHECK_SHA }}
          path: trusted-bootstrap
          persist-credentials: false
      - name: Validate baseline using trusted policy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const policySource = process.env.BOOTSTRAP_TYPECHECK_SHA ? 'trusted-bootstrap' : 'trusted-base';
            const policyPath = `${process.cwd()}/${policySource}/scripts/typecheck-policy.mjs`;
            if (!fs.existsSync(policyPath)) {
              core.setFailed('Trusted policy missing: review a tooling commit and set TYPESCRIPT_GATE_BOOTSTRAP_SHA; see docs/agents/typecheck.md.');
              return;
            }
            const { validateBaseline } = await import(pathToFileURL(policyPath).href);
            const pr = context.payload.pull_request;
            async function readText(path, ref, allowMissing = false) {
              try {
                const { data } = await github.rest.repos.getContent({
                  ...context.repo, path, ref,
                  mediaType: { format: 'raw' },
                });
                return typeof data === 'string' ? data : Buffer.from(data.content, 'base64').toString('utf8');
              } catch (error) {
                if (allowMissing && error.status === 404) return null;
                throw error;
              }
            }
            const current = JSON.parse(await readText('scripts/typecheck-baseline.json', pr.head.sha));
            validateBaseline(current);
            core.info(`TypeScript baseline is valid at ${pr.head.sha}; baseline updates do not require a separate approval.`);

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint repository sources
        run: pnpm lint

      - name: TypeScript gate regression tests
        run: pnpm test:typecheck

      - name: Component regression tests
        run: pnpm test:components

      - name: Regression guards (dashboards + permission personas)
        run: pnpm test:guards
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

      - name: Environment and report regression tests
        run: node --test supabase/functions/_shared/staging-outbound.test.mjs supabase/functions/_shared/staging-whatsapp-test.test.ts supabase/functions/_shared/staging-email-test.test.ts supabase/functions/_shared/automation-run-auth.test.ts supabase/functions/_shared/meeting-summary-prompts.test.ts supabase/functions/_shared/signature-field-text.test.ts supabase/functions/_shared/signature-email-template.test.ts supabase/functions/_shared/report-sync-window.test.ts src/lib/carmenLoaderSignal.test.ts src/lib/clipboardFiles.test.ts src/lib/reportRecords.test.ts src/lib/reportCoverage.test.ts src/lib/reportSyncCadence.test.ts src/lib/dashboardDateFilters.test.ts src/lib/weeklyAdsComparison.test.ts src/lib/adAccountUrl.test.ts src/lib/gaPropertyMatch.test.ts supabase/functions/_shared/gaDomain.test.ts src/lib/leadTableLayout.test.ts src/lib/leadTableColumns.test.ts src/lib/leadViewMode.test.ts src/lib/leadStageFilter.test.ts src/lib/recordingPlayback.test.ts src/lib/recordingSummaryTarget.test.ts src/lib/sharedReportTabs.test.ts src/lib/signatureFieldGuide.test.ts src/lib/signatureDate.test.ts src/lib/teamMemberMatch.test.ts supabase/functions/_shared/automation-status.test.ts supabase/functions/webhook-lead-intake/lead-duplicate-match.test.ts supabase/functions/webhook-lead-intake/returning-lead.test.ts supabase/functions/_shared/lead-repeat-reopen.test.ts supabase/functions/_shared/broadcast/template/template.test.ts supabase/functions/_shared/broadcast/template/template-content.test.ts supabase/functions/_shared/broadcast/mailing-actions/target.test.ts supabase/functions/_shared/broadcast/mailing-actions/send-to-list.test.ts supabase/functions/_shared/broadcast/audience/resolve.test.ts supabase/functions/_shared/timing-safe-equal.test.ts src/lib/leadRecordings.test.ts supabase/functions/_shared/telephony/phone.test.ts supabase/functions/make-pbx-call/outbound.test.ts supabase/functions/pbx-webhook/event.test.ts src/components/marketing/departments/creative/videoScenes.test.ts src/components/marketing/departments/creative/videoStill.test.ts src/components/marketing/departments/creative/videoReference.test.ts src/components/marketing/departments/creative/videoClip.test.ts src/components/marketing/departments/creative/videoProduction.test.ts src/components/marketing/departments/creative/videoEngines.test.ts supabase/functions/_shared/video-director-tools.test.ts supabase/functions/_shared/creative-studio-tools.test.ts src/components/marketing/departments/creative/studioChat.test.ts render-worker/test/shots.test.mjs render-worker/test/ffmpeg.test.mjs render-worker/test/clip.test.mjs render-worker/test/engines.test.mjs render-worker/test/timeline.test.mjs render-worker/test/narration.test.mjs render-worker/test/targets.test.mjs render-worker/test/loop.test.mjs render-worker/test/clip-fallback.test.mjs render-worker/test/geminiTts.test.mjs render-worker/test/workshop-manifest.test.mjs render-worker/test/workshop-edit.test.mjs render-worker/test/lipsync.test.mjs render-worker/test/inflight.test.mjs supabase/functions/_shared/carmen/brain-access.test.ts src/components/carmen-command/useDraggableCard.test.ts src/lib/chatTopics.test.ts supabase/functions/_shared/carmen/topic-text.test.ts supabase/functions/_shared/carmen/voice-access.test.ts src/lib/menuStructure.tabRoute.test.ts src/lib/moduleRoutePermissions.test.ts src/components/marketing/departments/creative/brandKit.test.ts supabase/functions/_shared/workshop/defaults.test.ts supabase/functions/_shared/workshop/artifacts.test.ts supabase/functions/_shared/workshop/capabilities.test.ts supabase/functions/_shared/workshop/image-providers.test.ts supabase/functions/_shared/workshop/look.test.ts supabase/functions/_shared/workshop/production.test.ts supabase/functions/_shared/workshop/site-report.test.ts supabase/functions/_shared/workshop/public-url.test.ts supabase/functions/_shared/workshop/assets.test.ts supabase/functions/_shared/workshop/reply.test.ts supabase/functions/_shared/workshop/video-cost.test.ts supabase/functions/_shared/workshop/higgsfield-credential.test.ts render-worker/test/higgsfield-credential.test.mjs supabase/functions/_shared/workshop/budget.test.ts supabase/functions/_shared/workshop/edit-plan.test.ts supabase/functions/_shared/workshop/roles.test.ts supabase/functions/_shared/workshop/brief-answers.test.ts supabase/functions/_shared/workshop/voices.test.ts supabase/functions/_shared/workshop/turn-note.test.ts supabase/functions/_shared/workshop/tapped-answers.test.ts supabase/functions/_shared/workshop/role-project.test.ts supabase/functions/_shared/workshop-tools.test.ts src/lib/workshopBridge.test.ts src/lib/quickReplies.test.ts src/components/workshop/workshopFeed.test.ts src/components/workshop/shimmer.test.ts src/components/workshop/workshopAssets.test.ts supabase/functions/_shared/carmen/brain-connections/helpers.test.ts supabase/functions/_shared/carmen/brain-connections/overrides.test.ts supabase/functions/_shared/carmen/free-first/router.test.ts supabase/functions/_shared/carmen/free-first/classifier.test.ts supabase/functions/_shared/carmen/free-first/failover.test.ts supabase/functions/_shared/carmen/free-first/cost.test.ts supabase/functions/_shared/carmen/free-first/budget-reservation.test.ts supabase/functions/_shared/carmen/free-first/candidates.test.ts render-worker/test/openrouter.test.mjs src/components/carmen-command/chatDedupe.test.ts supabase/functions/_shared/carmen/brain-engine/plan.test.ts supabase/functions/_shared/creative/openrouterImage.test.ts supabase/functions/_shared/creative/ad-image-remote.test.ts

      - name: Carmen pulse regression tests
        run: node --experimental-strip-types --test supabase/functions/_shared/pulse-foundation.test.mjs supabase/functions/_shared/client-retention.test.ts supabase/functions/_shared/agent-channel/whatsapp-direct.test.ts supabase/functions/_shared/carmen-direct-tools.test.mjs supabase/functions/_shared/report-meta-verify.test.mjs supabase/functions/_shared/cron-next.test.ts src/lib/carmenTaskRows.test.ts supabase/functions/_shared/carmen-connection-role.test.ts supabase/functions/_shared/carmen-group-verification.test.mjs supabase/functions/_shared/carmen-group-invocation.test.mjs supabase/functions/_shared/carmen-access-policy.test.mjs

      - name: Build frontend
        run: pnpm build

  mirror-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mirror: ${{ steps.filter.outputs.mirror }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - id: filter
        name: Detect mirror script changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Pushes and reusable calls always run; only PRs are narrowed.
          if [ -z "$BASE_SHA" ] || git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^scripts/(staging_mirror/|sync-staging-data\.py|sync-agent-credentials\.py|verify-staging-containment\.py|staging-data-manifest\.json|test_staging_mirror)|^supabase/ops/install_staging_data_mirror\.sql$'; then
            echo "mirror=true" >> "$GITHUB_OUTPUT"
          else
            echo "mirror=false" >> "$GITHUB_OUTPUT"
          fi

  mirror-sql:
    needs: mirror-changes
    if: needs.mirror-changes.outputs.mirror == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mirror_test
          POSTGRES_USER: mirror_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Mirror contract tests
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror.py'
      - name: Verify mirror transactions on disposable PostgreSQL
        env:
          MIRROR_TEST_DSN: postgresql://mirror_test:disposable_test_only@localhost:5432/mirror_test
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror_postgres.py'
