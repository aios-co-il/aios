name: CI — frontend build

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  pull_request:
    branches: [main, develop]
  # Baseline additions are allowed only after approval of the current PR head.
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main, develop]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    if: github.event_name != 'pull_request_review' || contains(fromJSON('["main", "develop"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOOTSTRAP_TYPECHECK_SHA: ${{ secrets.TYPESCRIPT_GATE_BOOTSTRAP_SHA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.source_sha || github.sha }}
          path: trusted-base
          persist-credentials: false

      - name: Validate optional reviewed bootstrap revision
        run: |
          if [ -n "$BOOTSTRAP_TYPECHECK_SHA" ] && ! [[ "$BOOTSTRAP_TYPECHECK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'TYPESCRIPT_GATE_BOOTSTRAP_SHA must be a reviewed, full commit SHA.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        if: env.BOOTSTRAP_TYPECHECK_SHA != ''
        with:
          ref: ${{ env.BOOTSTRAP_TYPECHECK_SHA }}
          path: trusted-bootstrap
          persist-credentials: false

      - name: Prepare isolated trusted checker
        id: checker
        run: |
          policy_source="$GITHUB_WORKSPACE/trusted-base"
          if [ -n "$BOOTSTRAP_TYPECHECK_SHA" ]; then
            policy_source="$GITHUB_WORKSPACE/trusted-bootstrap"
          fi
          if [ ! -f "$policy_source/scripts/typecheck-policy.mjs" ] || [ ! -f "$policy_source/scripts/typecheck.mjs" ]; then
            echo 'Trusted checker missing: review a tooling commit and set TYPESCRIPT_GATE_BOOTSTRAP_SHA; see docs/agents/typecheck.md.' >&2
            exit 1
          fi
          checker_directory="$RUNNER_TEMP/trusted-typecheck"
          mkdir -p "$checker_directory/scripts"
          cp "$policy_source/scripts/typecheck.mjs" "$policy_source/scripts/typecheck-policy.mjs" "$checker_directory/scripts/"
          cp "$policy_source/package.json" "$policy_source/pnpm-lock.yaml" "$checker_directory/"
          echo "directory=$checker_directory" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install trusted compiler dependencies without hooks
        working-directory: ${{ steps.checker.outputs.directory }}
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: project
          persist-credentials: false
      - name: Install project dependencies as type-check input only
        working-directory: project
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Full frontend TypeScript gate using trusted checker
        env:
          CHECKER_DIRECTORY: ${{ steps.checker.outputs.directory }}
        working-directory: project
        run: node "$CHECKER_DIRECTORY/scripts/typecheck.mjs" --project "$PWD"

  baseline-review:
    if: github.event.pull_request && contains(fromJSON('["main", "develop"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      BOOTSTRAP_TYPECHECK_SHA: ${{ secrets.TYPESCRIPT_GATE_BOOTSTRAP_SHA }}
    steps:
      # This job never checks out, installs, imports, or executes PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Validate optional reviewed bootstrap revision
        run: |
          if [ -n "$BOOTSTRAP_TYPECHECK_SHA" ] && ! [[ "$BOOTSTRAP_TYPECHECK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'TYPESCRIPT_GATE_BOOTSTRAP_SHA must be a reviewed, full commit SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: env.BOOTSTRAP_TYPECHECK_SHA != ''
        with:
          ref: ${{ env.BOOTSTRAP_TYPECHECK_SHA }}
          path: trusted-bootstrap
          persist-credentials: false
      - name: Require maintainer review using trusted policy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const policySource = process.env.BOOTSTRAP_TYPECHECK_SHA ? 'trusted-bootstrap' : 'trusted-base';
            const policyPath = `${process.cwd()}/${policySource}/scripts/typecheck-policy.mjs`;
            if (!fs.existsSync(policyPath)) {
              core.setFailed('Trusted policy missing: review a tooling commit and set TYPESCRIPT_GATE_BOOTSTRAP_SHA; see docs/agents/typecheck.md.');
              return;
            }
            const { baselineAdditions, approvingMaintainer } = await import(pathToFileURL(policyPath).href);
            const pr = context.payload.pull_request;
            async function readText(path, ref, allowMissing = false) {
              try {
                const { data } = await github.rest.repos.getContent({
                  ...context.repo, path, ref,
                  mediaType: { format: 'raw' },
                });
                return typeof data === 'string' ? data : Buffer.from(data.content, 'base64').toString('utf8');
              } catch (error) {
                if (allowMissing && error.status === 404) return null;
                throw error;
              }
            }
            const baseBaseline = await readText('scripts/typecheck-baseline.json', pr.base.sha, true);
            const previous = baseBaseline === null ? null : JSON.parse(baseBaseline);
            const current = JSON.parse(await readText('scripts/typecheck-baseline.json', pr.head.sha));
            let configChanged = false;
            for (const file of ['tsconfig.json', 'tsconfig.app.json']) {
              const before = await readText(file, pr.base.sha, true);
              const after = await readText(file, pr.head.sha);
              if (before !== after) configChanged = true;
            }
            if (!baselineAdditions(current, previous) && !configChanged) return;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: pr.number,
            });
            const approver = await approvingMaintainer(reviews, pr.head.sha, async username => {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username,
              });
              return data.permission;
            });
            if (!approver) {
              core.setFailed('Baseline additions or compiler configuration changes require maintainer approval of the current PR head; approve, then rerun this job if no review-triggered run starts.');
              return;
            }
            const { data: latest } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
            if (latest.head.sha !== pr.head.sha) {
              core.setFailed('PR head changed during approval validation; rerun on the latest revision.');
              return;
            }
            core.info(`Baseline additions approved by ${approver} at ${pr.head.sha}.`);

  build:
    if: github.event_name != 'pull_request_review' || contains(fromJSON('["main", "develop"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript gate regression tests
        run: pnpm test:typecheck

      - name: Regression guards (dashboards + permission personas)
        run: pnpm test:guards
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

      - name: Environment and report regression tests
        run: node --test scripts/edge-deploy-plan.test.mjs scripts/deploy-edge.test.mjs supabase/functions/_shared/staging-outbound.test.mjs supabase/functions/_shared/meeting-summary-prompts.test.ts supabase/functions/_shared/signature-field-text.test.ts supabase/functions/_shared/signature-email-template.test.ts supabase/functions/_shared/report-sync-window.test.ts src/lib/carmenLoaderSignal.test.ts src/lib/clipboardFiles.test.ts src/lib/reportRecords.test.ts src/lib/reportCoverage.test.ts src/lib/reportSyncCadence.test.ts src/lib/dashboardDateFilters.test.ts src/lib/weeklyAdsComparison.test.ts src/lib/adAccountUrl.test.ts src/lib/gaPropertyMatch.test.ts supabase/functions/_shared/gaDomain.test.ts src/lib/leadTableLayout.test.ts src/lib/leadTableColumns.test.ts src/lib/leadViewMode.test.ts src/lib/recordingPlayback.test.ts src/lib/recordingSummaryTarget.test.ts src/lib/sharedReportTabs.test.ts src/lib/signatureFieldGuide.test.ts src/lib/signatureDate.test.ts src/lib/teamMemberMatch.test.ts

      - name: Mirror contract tests
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror.py'

      - name: Carmen pulse regression tests
        run: node --experimental-strip-types --test supabase/functions/_shared/pulse-foundation.test.mjs supabase/functions/_shared/client-retention.test.ts supabase/functions/_shared/agent-channel/whatsapp-direct.test.ts supabase/functions/_shared/carmen-direct-tools.test.mjs supabase/functions/_shared/report-meta-verify.test.mjs

      - name: Build frontend
        run: pnpm build

  mirror-sql:
    if: github.event_name != 'pull_request_review' || contains(fromJSON('["main", "develop"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mirror_test
          POSTGRES_USER: mirror_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify mirror transactions on disposable PostgreSQL
        env:
          MIRROR_TEST_DSN: postgresql://mirror_test:disposable_test_only@localhost:5432/mirror_test
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror_postgres.py'
