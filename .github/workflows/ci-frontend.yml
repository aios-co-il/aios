name: CI — frontend build

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  pull_request:
    branches: [main, develop]
  # develop is covered by pull_request and its merge queue, which test the same content.
  push:
    branches: [main]
  # develop's merge queue: each queued PR is checked on top of the PRs ahead of it.
  merge_group:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One cheap job decides which gated jobs run. Pushes and reusable calls run everything;
  # PRs and merge-queue runs are narrowed. Skipped jobs report success to the ruleset.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.exclusions.outputs.code || 'true' }}
      frontend: ${{ steps.exclusions.outputs.frontend || 'true' }}
      functions: ${{ steps.areas.outputs.functions || 'true' }}
      mirror: ${{ steps.areas.outputs.mirror || 'true' }}
      supabase-types: ${{ steps.areas.outputs.supabase-types || 'true' }}
      worker: ${{ steps.areas.outputs.worker || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Pushes and reusable calls have no base, so these steps skip and every output defaults to true.
      # PRs use the API; merge-queue runs diff against the queue's base SHA.
      - id: exclusions
        if: github.event.pull_request || github.event.merge_group
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.merge_group.base_sha }}
          # "every" lets a filter subtract: it runs unless every changed file is ignorable.
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"
            frontend:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!supabase/migrations/**"
              - "!supabase/tests/**"
              - "!supabase/ops/**"
              - "!supabase/seeds/**"
      - id: areas
        if: github.event.pull_request || github.event.merge_group
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            functions:
              - "supabase/functions/**"
              - ".github/workflows/ci-frontend.yml"
              - ".github/actions/**"
            worker:
              - "render-worker/**"
              - ".github/workflows/ci-frontend.yml"
              - ".github/actions/**"
            supabase-types:
              - "supabase/migrations/**"
              - "src/integrations/supabase/types.ts"
              - "supabase/functions/_shared/database.types.ts"
              - ".github/workflows/check-supabase-types.yml"
            mirror:
              - "scripts/staging_mirror/**"
              - "scripts/sync-staging-data.py"
              - "scripts/sync-agent-credentials.py"
              - "scripts/verify-staging-containment.py"
              - "scripts/staging-data-manifest.json"
              - "scripts/test_staging_mirror*"
              - "supabase/ops/install_staging_data_mirror.sql"

  typescript:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOOTSTRAP_TYPECHECK_SHA: ${{ secrets.TYPESCRIPT_GATE_BOOTSTRAP_SHA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.source_sha || github.sha }}
          path: trusted-base
          persist-credentials: false

      - name: Validate optional reviewed bootstrap revision
        run: |
          if [ -n "$BOOTSTRAP_TYPECHECK_SHA" ] && ! [[ "$BOOTSTRAP_TYPECHECK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'TYPESCRIPT_GATE_BOOTSTRAP_SHA must be a reviewed, full commit SHA.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        if: env.BOOTSTRAP_TYPECHECK_SHA != ''
        with:
          ref: ${{ env.BOOTSTRAP_TYPECHECK_SHA }}
          path: trusted-bootstrap
          persist-credentials: false

      - name: Prepare isolated trusted checker
        id: checker
        run: |
          policy_source="$GITHUB_WORKSPACE/trusted-base"
          if [ -n "$BOOTSTRAP_TYPECHECK_SHA" ]; then
            policy_source="$GITHUB_WORKSPACE/trusted-bootstrap"
          fi
          if [ ! -f "$policy_source/scripts/typecheck-policy.mjs" ] || [ ! -f "$policy_source/scripts/typecheck.mjs" ]; then
            echo 'Trusted checker missing: review a tooling commit and set TYPESCRIPT_GATE_BOOTSTRAP_SHA; see docs/agents/typecheck.md.' >&2
            exit 1
          fi
          checker_directory="$RUNNER_TEMP/trusted-typecheck"
          mkdir -p "$checker_directory/scripts"
          cp "$policy_source/scripts/typecheck.mjs" "$policy_source/scripts/typecheck-policy.mjs" "$checker_directory/scripts/"
          cp "$policy_source/package.json" "$policy_source/pnpm-lock.yaml" "$checker_directory/"
          echo "directory=$checker_directory" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: trusted-base/pnpm-lock.yaml
      - name: Install trusted compiler dependencies without hooks
        working-directory: ${{ steps.checker.outputs.directory }}
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: project
          persist-credentials: false
      - name: Install project dependencies as type-check input only
        working-directory: project
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Full frontend TypeScript gate using trusted checker
        env:
          CHECKER_DIRECTORY: ${{ steps.checker.outputs.directory }}
        working-directory: project
        run: node "$CHECKER_DIRECTORY/scripts/typecheck.mjs" --project "$PWD"

      - name: Validate TypeScript baseline using trusted policy
        if: github.event.pull_request && contains(fromJSON('["main", "develop"]'), github.event.pull_request.base.ref)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const policySource = process.env.BOOTSTRAP_TYPECHECK_SHA ? 'trusted-bootstrap' : 'trusted-base';
            const policyPath = `${process.cwd()}/${policySource}/scripts/typecheck-policy.mjs`;
            if (!fs.existsSync(policyPath)) {
              core.setFailed('Trusted policy missing: review a tooling commit and set TYPESCRIPT_GATE_BOOTSTRAP_SHA; see docs/agents/typecheck.md.');
              return;
            }
            const { validateBaseline } = await import(pathToFileURL(policyPath).href);
            const pr = context.payload.pull_request;
            const { data } = await github.rest.repos.getContent({
              ...context.repo, path: 'scripts/typecheck-baseline.json', ref: pr.head.sha,
              mediaType: { format: 'raw' },
            });
            const current = JSON.parse(typeof data === 'string' ? data : Buffer.from(data.content, 'base64').toString('utf8'));
            validateBaseline(current);
            core.info(`TypeScript baseline is valid at ${pr.head.sha}; baseline updates do not require a separate approval.`);

  lint-format:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Check formatting (Prettier)
        run: pnpm format:check
      - name: Lint repository sources
        run: pnpm lint

  worker-typecheck:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Type-check the render worker
        run: pnpm typecheck:worker

  tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: TypeScript gate regression tests
        run: pnpm test:typecheck
      - name: Component regression tests
        run: pnpm test:components

  guards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Regression guards (dashboards + permission personas)
        run: pnpm test:guards
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

  deno:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge function tests (Deno)
        # Edge functions import `npm:` packages. Without this flag Deno finds the repo's package.json and
        # demands an installed node_modules; with it, Deno fetches them itself and no install hooks run.
        run: deno test -A --no-check --node-modules-dir=none supabase/functions

  # Vercel builds every PR preview but not the merge queue's combined commit, so only the queue builds here.
  build:
    needs: changes
    if: github.event_name == 'merge_group' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Build frontend
        run: pnpm build

  check-supabase-types:
    needs: changes
    if: needs.changes.outputs.supabase-types == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/check-supabase-types.yml

  # The one check the develop ruleset requires. Skipped jobs pass; failed or cancelled ones fail.
  ci-gate:
    if: always()
    needs:
      [
        changes,
        typescript,
        lint-format,
        worker-typecheck,
        tests,
        guards,
        deno,
        build,
        check-supabase-types,
        mirror-sql,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if grep -Eq '"(failure|cancelled)"' <<<"$RESULTS"; then
            echo "::error::A CI job failed or was cancelled: $RESULTS"
            exit 1
          fi

  mirror-sql:
    needs: changes
    if: needs.changes.outputs.mirror == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mirror_test
          POSTGRES_USER: mirror_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Mirror contract tests
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror.py'
      - name: Verify mirror transactions on disposable PostgreSQL
        env:
          MIRROR_TEST_DSN: postgresql://mirror_test:disposable_test_only@localhost:5432/mirror_test
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror_postgres.py'
