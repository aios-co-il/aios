name: Import approved Carmen soft artwork

on:
  push:
    branches: [feature/carmen-approved-visual-hero]
    paths: [.github/workflows/carmen-approved-assets-import.yml]

permissions:
  contents: write
  issues: read

jobs:
  import:
    if: github.ref == 'refs/heads/feature/carmen-approved-visual-hero'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carmen-approved-visual-hero
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow==11.3.0'
      - name: Import exact approved artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, re, urllib.request
          from pathlib import Path
          from PIL import Image
          root = Path('public/brand/carmen')
          root.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request('https://api.github.com/repos/davidcastelnuovo/aios/issues/comments/6143715935', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          comment = json.load(urllib.request.urlopen(req))['body']
          manifest = json.loads(re.search(r'```json\s*(.*?)\s*```', comment, re.S).group(1))
          approved = {'wordmark': 'f8e25e8d4f20b6c5e5e83ad309f97b09797581fc21a42550cc0dab1fa505aa9c', 'symbol': '080a5964dd8e299f5fcf537485ab161dd3d3dd45b01bdffd611c3c074ef82f6d'}
          records = {}
          for item in manifest['assets']:
              key = item['name']
              if key not in approved or item['sha256'] != approved[key]:
                  raise ValueError('Unexpected asset identity')
              from urllib.parse import urlparse
              parsed = urlparse(item['url'])
              if parsed.scheme != 'https' or not parsed.hostname.endswith('.oaiusercontent.com'):
                  raise ValueError('Unexpected asset host')
              data = urllib.request.urlopen(item['url'], timeout=45).read(10000000)
              if hashlib.sha256(data).hexdigest() != approved[key]:
                  raise ValueError('Source checksum mismatch')
              (root / (key + '-soft-source.png')).write_bytes(data)
              im = Image.open(io.BytesIO(data)).convert('RGBA')
              if im.getchannel('A').getextrema() != (0, 255):
                  raise ValueError('Source alpha is missing')
              box = im.getchannel('A').point(lambda a: 255 if a > 1 else 0).getbbox()
              art = im.crop(box)
              pad = max(24, round(max(art.size) * .035))
              canvas = Image.new('RGBA', (art.width + 2 * pad, art.height + 2 * pad))
              canvas.alpha_composite(art, (pad, pad))
              canvas.save(root / (key + '-soft.png'), optimize=True)
              canvas.save(root / (key + '-soft.webp'), lossless=True, method=6)
              records[key] = {'file': key + '-soft.webp', 'png': key + '-soft.png', 'source': key + '-soft-source.png', 'source_sha256': approved[key], 'width': canvas.width, 'height': canvas.height, 'processing': 'Alpha-bound crop and transparent padding only. No redrawing or recoloring.'}
          (root / 'soft-assets.json').write_text(json.dumps({'brand': 'Carmen Marketing OS', 'status': 'approved-soft-artwork', 'assets': records}, indent=2) + '\n')
          page = Path('src/pages/Landing.tsx')
          text = page.read_text().replace('/carmen-wordmark.svg', '/brand/carmen/wordmark-soft.webp').replace('/carmen-symbol.svg', '/brand/carmen/symbol-soft.webp')
          page.write_text(text)
          css = Path('src/pages/carmen-landing.css')
          css.write_text(css.read_text() + '''
          /* Approved original raster artwork; no drawn substitutes. */
          .carmen-site .carmen-brand-wordmark-image { display: block; width: 212px; height: auto; max-height: 82px; object-fit: contain; }
          .carmen-site .hero-carmen-symbol { opacity: .8; filter: none; width: min(100%, 650px); height: 100%; object-fit: contain; }
          .carmen-site .carmen-magnetic-ribbon { display: none; }
          @media (max-width: 900px) { .carmen-site .nav nav { display: none; } .carmen-site .nav nav.open { display: flex; } }
          @media (max-width: 550px) { .carmen-site .carmen-brand-wordmark-image { width: 146px; max-height: 62px; } .carmen-site .hero-carmen-symbol { width: 100%; opacity: .8; } }
          ''')
          PY
      - name: Format changed files
        run: npx --yes prettier@3.6.2 --write src/pages/Landing.tsx src/pages/carmen-landing.css public/brand/carmen/soft-assets.json .github/workflows/carmen-approved-assets-import.yml
      - name: Commit approved assets to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189828282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/carmen/ src/pages/Landing.tsx src/pages/carmen-landing.css .github/workflows/carmen-approved-assets-import.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(brand): install approved soft artwork and use exact original assets'
          git push origin HEAD:refs/heads/feature/carmen-approved-visual-hero
