# Fail PRs into `main` whose head is behind `main`.
# Prevents stale-branch merges that silently overwrite newer fixes
# (see docs/postmortems/2026-09-09-dmm-dashboards-regression.md).
# `develop` uses the ruleset rule "Require branches to be up to date before merging"
# instead. This workflow stays for `main` because a release PR may hold the main
# commits as patch-equivalents rather than ancestors, which the ruleset rule rejects.
#
# Enable as a required status check in the `main` ruleset → "Branch contains latest main".

name: Require PR up to date with main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: pr-main-up-to-date-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  up-to-date:
    name: Branch contains latest main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fail if behind base
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git merge-base --is-ancestor "origin/${BASE_REF}" HEAD; then
            echo "OK — HEAD contains latest origin/${BASE_REF}"
            exit 0
          fi
          # Release PR: rebase-merges and cherry-picked hotfixes give main and develop
          # equivalent patches under different SHAs, so ancestry can't hold. Accept the
          # PR when every main commit has a patch-equivalent in HEAD.
          if [ "$BASE_REF" = main ] && [ "$HEAD_REF" = develop ] && [ "$SAME_REPO" = true ] \
            && scripts/main-missing-from.sh HEAD; then
            echo "OK — every main change has an equivalent in HEAD"
            exit 0
          fi
          BEHIND=$(git rev-list --count HEAD.."origin/${BASE_REF}" || true)
          echo "::error::PR branch is ${BEHIND} commit(s) behind origin/${BASE_REF}."
          echo "Rebase onto the latest base before merging (history is linear, do not merge it in):"
          echo "  git fetch origin ${BASE_REF}"
          echo "  git rebase origin/${BASE_REF}"
          echo "Stale merges overwrite newer call sites (DMM dashboards / Clients Dialog regressions)."
          exit 1
