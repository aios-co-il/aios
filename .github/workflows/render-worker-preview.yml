name: Render worker (PR preview)

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: render-worker-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      PARENT_REF: ${{ vars.PROD_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Remotion
        working-directory: workers/creative-video/remotion
        run: npm install --no-audit --no-fund && npx remotion browser ensure

      # The account token can read every project's keys. Only these two steps see it;
      # the install and drain steps run branch code and get the preview's own key only.
      - name: Resolve this branch's Supabase preview
        id: preview
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          want = os.environ["GIT_BRANCH"]
          parent = os.environ.get("PARENT_REF", "").strip()

          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          found = ""
          if want not in ("main", "develop"):
              parents = [parent] if parent else []
              if not parents:
                  projects = get("https://api.supabase.com/v1/projects")
                  if isinstance(projects, dict):
                      projects = projects.get("projects") or []
                  parents = [p.get("id") or p.get("ref") for p in projects if isinstance(p, dict)]
              for ref in parents:
                  if not ref:
                      continue
                  try:
                      branches = get(f"https://api.supabase.com/v1/projects/{ref}/branches")
                  except urllib.error.HTTPError:
                      continue
                  if isinstance(branches, dict):
                      branches = branches.get("branches") or []
                  for branch in branches:
                      if branch.get("git_branch") != want or branch.get("is_default"):
                          continue
                      found = branch.get("project_ref") or ""
                      break
                  if found:
                      break
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"ref={found}\n")
          if not found:
              print(f"No Supabase preview for {want}; nothing to drain")
          PY

      - name: Resolve preview service key
        if: steps.preview.outputs.ref != ''
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.preview.outputs.ref }}
        run: |
          set -euo pipefail
          KEYS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys")"
          SERVICE_KEY="$(jq -r '.[] | select(.name == "service_role") | .api_key' <<<"$KEYS")"
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "Could not resolve the preview service_role key" >&2
            exit 1
          fi
          echo "::add-mask::$SERVICE_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://${PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"

      - name: Drain queued video runs on the preview
        if: steps.preview.outputs.ref != ''
        working-directory: render-worker
        env:
          DRAIN: "1"
          # Keep listening 15 minutes after the queue empties, so a film started while
          # testing the Preview is still made.
          DRAIN_IDLE_MS: "900000"
          # Stop claiming clips and lip syncs (they poll up to 15 minutes) 35 minutes in, so
          # they end before the 60-minute cap; voice, music and the render are still taken.
          # A killed run is queued again.
          STOP_CLAIMING_AFTER_MS: "2100000"
          CONCURRENCY: "2"
          POLL_MS: "2000"
          WORKER_ID: gha-preview
          WORKER_ENV: preview
        # exec: the runner's stop signal reaches node (not only bash), so it requeues its runs.
        run: exec node src/index.mjs
