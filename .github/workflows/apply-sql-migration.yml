            elif echo "$CHANGED" | grep -qx 'supabase/ops/fix_woocommerce_client_scoped_select.sql'; then
              FILE="supabase/ops/fix_woocommerce_client_scoped_select.sql"
              NAME="fix_woocommerce_client_scoped_select"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/fix_4_4_woocommerce_revenue_sync.sql'; then
              FILE="supabase/ops/fix_4_4_woocommerce_revenue_sync.sql"
              NAME="fix_4_4_woocommerce_revenue_sync"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/create_meeting_bot_sessions.sql'; then
              FILE="supabase/ops/create_meeting_bot_sessions.sql"
              NAME="create_meeting_bot_sessions"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/fix_crm_dashboards_shared_agency_writes.sql'; then
