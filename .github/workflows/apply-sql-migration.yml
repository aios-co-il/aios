              NAME="create_cursor_sticky_agents"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/create_cursor_dispatches.sql'; then
              FILE="supabase/ops/create_cursor_dispatches.sql"
              NAME="create_cursor_dispatches"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/fix_clients_seo_keyword_relevance.sql'; then
              FILE="supabase/ops/fix_clients_seo_keyword_relevance.sql"
              NAME="fix_clients_seo_keyword_relevance"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/fix_seo_monthly_updates_cross_tenant.sql'; then
              FILE="supabase/ops/fix_seo_monthly_updates_cross_tenant.sql"
              NAME="fix_seo_monthly_updates_cross_tenant"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/fix_cross_tenant_client_task_updates.sql'; then
              FILE="supabase/ops/fix_cross_tenant_client_task_updates.sql"
              NAME="fix_cross_tenant_client_task_updates"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_seo_monthly_shares.sql'; then
              FILE="supabase/ops/apply_seo_monthly_shares.sql"
              NAME="apply_seo_monthly_shares"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_client_retention_daily_production.sql'; then
              FILE="supabase/ops/apply_client_retention_daily_production.sql"
              NAME="pause_client_retention_daily_production"
            else
              echo "No matching supabase/ops SQL file in push; skipping apply."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          test -f "$FILE"
          echo "Resolved FILE=$FILE NAME=$NAME"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Apply via /database/migrations
        if: steps.sql.outputs.skip != 'true'
        run: |
          set -euo pipefail
          FILE="${{ steps.sql.outputs.file }}"
          NAME="${{ steps.sql.outputs.name }}"
          python3 - <<'PY'
          import json, os, pathlib, sys, time, urllib.error, urllib.request

          path = os.environ["SQL_FILE"]
          name = os.environ["MIG_NAME"]
          query = pathlib.Path(path).read_text()
          body = json.dumps({"query": query, "name": name}).encode()
          url = f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/migrations"
          headers = {
              "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "aios-apply-sql-migration/1.0",
              "Accept": "application/json",
          }

          last_err = None
          for attempt in range(1, 6):
              req = urllib.request.Request(url, data=body, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      raw = resp.read().decode()
                      print(f"HTTP {resp.status} attempt={attempt}")
                      print(raw[:4000])
                      sys.exit(0)
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  print(f"HTTP {e.code} attempt={attempt}", file=sys.stderr)
                  print(raw[:4000], file=sys.stderr)
                  last_err = e
                  if e.code in (403, 429, 500, 502, 503, 504) and attempt < 5:
                      time.sleep(60)
                      continue
                  sys.exit(1)
              except Exception as e:
                  print(f"error attempt={attempt}: {e}", file=sys.stderr)
                  last_err = e
                  if attempt < 5:
                      time.sleep(60)
                      continue
                  sys.exit(1)
          raise SystemExit(str(last_err))
          PY
        env:
          SQL_FILE: ${{ steps.sql.outputs.file }}
          MIG_NAME: ${{ steps.sql.outputs.name }}
