              NAME="apply_pulse_campaigner_delivery"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_pulse_production_reconcile.sql'; then
              FILE="supabase/ops/apply_pulse_production_reconcile.sql"
              NAME="apply_pulse_production_reconcile"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_pulse_sunday_0730_david_campaigners.sql'; then
              FILE="supabase/ops/apply_pulse_sunday_0730_david_campaigners.sql"
              NAME="apply_pulse_sunday_0730_david_campaigners"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_pulse_sunday_0900_dmm_delivery.sql'; then
              FILE="supabase/ops/apply_pulse_sunday_0900_dmm_delivery.sql"
