name: Apply SQL migration (Management API)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "Path to SQL file under the repo"
        required: true
        default: "supabase/ops/apply_seo_monthly_shares.sql"
      migration_name:
        description: "Migration name recorded in Supabase"
        required: true
        default: "apply_seo_monthly_shares"
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-sql-migration.yml"
      - "supabase/ops/apply_lead_archive_and_home_agency.sql"
      - "supabase/ops/apply_seo_monthly_shares.sql"
