      - "supabase/ops/merge_same_email_campaigners_production.sql"
      - "supabase/ops/merge_assigned_campaigner_production.sql"
      - "supabase/ops/apply_morning_report_sync_production.sql"
      - "supabase/ops/apply_lead_status_updates_production.sql"
      - "supabase/ops/recover_promo_eyal_lead_updates_production.sql"

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PROJECT_REF: zvoijyneresvkadpprel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so github.event.before is resolvable for path diffs.
          fetch-depth: 0

      - name: Resolve SQL file
        id: sql
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ github.event.inputs.sql_file }}"
            NAME="${{ github.event.inputs.migration_name }}"
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            # Shallow / missing before SHA: fall back to files touched by HEAD.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              CHANGED=$(git show --pretty=format: --name-only "$SHA" | sort -u || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$SHA" | sort -u || true)
            fi
            echo "Changed files (ops resolve):"
            echo "$CHANGED" | grep '^supabase/ops/' || true

            # Prefer the newest ops migration that triggered this push.
            if echo "$CHANGED" | grep -qx 'supabase/ops/apply_morning_report_sync_production.sql'; then
              FILE="supabase/ops/apply_morning_report_sync_production.sql"
              NAME="apply_morning_report_sync_production"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/merge_assigned_campaigner_production.sql'; then
              FILE="supabase/ops/merge_assigned_campaigner_production.sql"
              NAME="merge_assigned_campaigner_production"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/merge_same_email_campaigners_production.sql'; then
              FILE="supabase/ops/merge_same_email_campaigners_production.sql"
              NAME="merge_same_email_campaigners_production"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/merge_duplicate_user_campaigners_production.sql'; then
              FILE="supabase/ops/merge_duplicate_user_campaigners_production.sql"
              NAME="merge_duplicate_user_campaigners_production"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_fix_duplicate_task_reminder_notifications_production.sql'; then
              FILE="supabase/ops/apply_fix_duplicate_task_reminder_notifications_production.sql"
              NAME="apply_fix_duplicate_task_reminder_notifications_production"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_recurring_human_tasks_production.sql'; then
              FILE="supabase/ops/apply_recurring_human_tasks_production.sql"
