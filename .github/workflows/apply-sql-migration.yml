            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_pulse_refresh_and_instant_alerts.sql'; then
              FILE="supabase/ops/apply_pulse_refresh_and_instant_alerts.sql"
              NAME="apply_pulse_refresh_and_instant_alerts"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/apply_pulse_twice_daily_cadence.sql'; then
              FILE="supabase/ops/apply_pulse_twice_daily_cadence.sql"
              NAME="apply_pulse_twice_daily_cadence"
            elif echo "$CHANGED" | grep -qx 'supabase/ops/fix_task_agency_and_assignment_notifications.sql'; then
