name: Pulse campaigner preview test (David only)

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
      SUPABASE_URL: https://${{ vars.PROD_PROJECT_REF }}.supabase.co
    steps:
      - name: Resolve production service key
        shell: bash
        run: |
          set -euo pipefail
          KEYS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys")"
          SERVICE_KEY="$(jq -r '.[] | select(.name == "service_role") | .api_key' <<<"$KEYS")"
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "Could not resolve the service_role key" >&2
            exit 1
          fi
          echo "::add-mask::$SERVICE_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"

      - name: Send preview-only scoped pulse digests to David
        shell: bash
        run: |
          set -euo pipefail
          for TENANT in \
            2dcdaac6-41bf-42cc-86bf-9a0b4b2e6019 \
            6ad8f321-25db-4a04-8e44-e57a7c8961b2
          do
            echo "Preview test for tenant $TENANT"
            curl --fail --silent --show-error -X POST \
              "$SUPABASE_URL/functions/v1/campaign-pulse-snapshot" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"tenant_id\":\"$TENANT\",\"deliver\":true,\"force_delivery\":true,\"preview_only\":true,\"source\":\"approved_manual_trigger\"}" \
              | tee "/tmp/pulse-preview-$TENANT.json"
            echo
          done
