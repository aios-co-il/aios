# Builds the Carmen Android app. On PRs and develop: unit tests and the Staging APK
# (artifact carmen-staging-apk), built from public repository variables. On main: also the
# Production APK (artifact carmen-production-apk), signed with the release key secrets.
name: Carmen Android

on:
  pull_request:
    paths:
      - "mobile/carmen-android/**"
      - ".github/workflows/carmen-android.yml"
  push:
    branches: [develop, main]
    paths:
      - "mobile/carmen-android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/carmen-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testStagingDebugUnitTest
      - name: Check backend variables
        env:
          CARMEN_SUPABASE_URL: ${{ vars.CARMEN_ANDROID_SUPABASE_URL }}
          CARMEN_SUPABASE_KEY: ${{ vars.CARMEN_ANDROID_SUPABASE_KEY }}
        run: |
          if [ -z "$CARMEN_SUPABASE_URL" ] || [ -z "$CARMEN_SUPABASE_KEY" ]; then
            echo "::error::Set repository variables CARMEN_ANDROID_SUPABASE_URL and CARMEN_ANDROID_SUPABASE_KEY (Staging URL and publishable key); without them the APK cannot sign in."
            exit 1
          fi
      - name: Build Staging APK
        # Staging backend for sign-in and the live conversation (public URL and publishable key).
        env:
          CARMEN_SUPABASE_URL: ${{ vars.CARMEN_ANDROID_SUPABASE_URL }}
          CARMEN_SUPABASE_KEY: ${{ vars.CARMEN_ANDROID_SUPABASE_KEY }}
        run: ./gradlew --no-daemon assembleStagingRelease
      - uses: actions/upload-artifact@v4
        with:
          name: carmen-staging-apk
          path: mobile/carmen-android/app/build/outputs/apk/staging/release/app-staging-release.apk
          if-no-files-found: error

  production:
    # Only main's code becomes the Production app.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/carmen-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Production APK
        # The release key reaches this step only; the backend values come from the tracked .env.
        env:
          KEYSTORE_BASE64: ${{ secrets.CARMEN_RELEASE_KEYSTORE_BASE64 }}
          CARMEN_RELEASE_STORE_PASSWORD: ${{ secrets.CARMEN_RELEASE_STORE_PASSWORD }}
          CARMEN_RELEASE_KEY_ALIAS: ${{ secrets.CARMEN_RELEASE_KEY_ALIAS }}
          CARMEN_RELEASE_KEY_PASSWORD: ${{ secrets.CARMEN_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$CARMEN_RELEASE_STORE_PASSWORD" ] || [ -z "$CARMEN_RELEASE_KEY_ALIAS" ]; then
            echo "::error::Set the CARMEN_RELEASE_* secrets (release keystore, passwords and alias) to build the Production APK."
            exit 1
          fi
          export CARMEN_RELEASE_STORE_FILE="$RUNNER_TEMP/carmen-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$CARMEN_RELEASE_STORE_FILE"
          ./gradlew --no-daemon assembleProductionRelease
          rm -f "$CARMEN_RELEASE_STORE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: carmen-production-apk
          path: mobile/carmen-android/app/build/outputs/apk/production/release/app-production-release.apk
          if-no-files-found: error
