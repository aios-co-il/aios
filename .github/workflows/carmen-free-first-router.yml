name: Carmen Free-First Router Tests

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/carmen/free-first-*.ts'
      - '.github/workflows/carmen-free-first-router.yml'
  push:
    branches: [develop]
    paths:
      - 'supabase/functions/_shared/carmen/free-first-*.ts'
      - '.github/workflows/carmen-free-first-router.yml'

permissions:
  contents: read

jobs:
  router-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d682002f4 # v4.4.0
        with:
          node-version: '22'
      - name: Run Carmen routing regression tests
        run: |
          node --experimental-strip-types --test \
            supabase/functions/_shared/carmen/free-first-router.test.ts \
            supabase/functions/_shared/carmen/free-first-task-classifier.test.ts \
            supabase/functions/_shared/carmen/free-first-failover.test.ts \
            supabase/functions/_shared/carmen/free-first-cost.test.ts
