name: Deploy Prod
run-name: Deploy Prod (${{ github.ref_name }})

# Runs on every push to main that touches Supabase sources. Approval is branch
# protection on `main`; functions wait for migrations when both changed.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/*edge*"
      - "scripts/staging-only-functions.json"
      - ".github/workflows/deploy-prod.yml"
      - ".github/workflows/_db_migrate.yml"
      - ".github/workflows/deploy-edge-reusable.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve changes
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations || 'true' }}
      functions: ${{ steps.filter.outputs.functions || 'true' }}
    steps:
      # Fail visibly when a manual run selects a non-Production branch.
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy Prod only runs from main (got $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@v4

      # A manual run has no `github.event.before`, so the functions deploy needs this tag
      # as its base. Fail now, before `migrate` applies anything.
      - name: Require the edge deployment tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git ls-remote --exit-code --tags origin refs/tags/edge-deployed-production >/dev/null \
            || { echo "::error::Tag edge-deployed-production is missing; a manual run cannot deploy functions."; exit 1; }

      - uses: dorny/paths-filter@v3
        id: filter
        # Without `base`, a push to main diffs against the default branch (`develop`),
        # which is empty after a fast-forward release. Manual runs deploy everything:
        # `supabase db push` and the function deploy skip what is already applied.
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event.before }}
          filters: |
            migrations:
              - 'supabase/migrations/**'
            functions:
              - 'supabase/functions/**'
              - 'supabase/config.toml'
              - 'scripts/*edge*'
              - 'scripts/staging-only-functions.json'

  migrate:
    needs: resolve
    if: needs.resolve.outputs.migrations == 'true'
    uses: ./.github/workflows/_db_migrate.yml
    with:
      target: production
    secrets: inherit

  functions:
    needs: [resolve, migrate]
    if: >
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.functions == 'true' &&
      needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled'
    uses: ./.github/workflows/deploy-edge-reusable.yml
    permissions:
      contents: write
      pull-requests: read
    with:
      environment: production
      source_sha: ${{ github.sha }}
      base_revision: ${{ github.event.before }}
    secrets: inherit
