name: _db_migrate

on:
  workflow_call:
    inputs:
      target:
        description: "staging or production"
        required: true
        type: string
      # Set for a labelled-PR deploy to Staging: the PR must still hold the lock.
      pr_number:
        type: string
        default: ""
    outputs:
      migrate_status:
        description: "Outcome of the migration push step (success/failure)"
        value: ${{ jobs.migrate.outputs.migrate_status }}

permissions:
  contents: read
  pull-requests: read

jobs:
  migrate:
    name: Push migrations (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    # Serialize `db push` per target across every caller (PR runs, develop pushes).
    concurrency:
      group: db-migrate-${{ inputs.target }}
      cancel-in-progress: false
    outputs:
      migrate_status: ${{ steps.push.outcome }}

    steps:
      - name: Validate target
        run: |
          case "${{ inputs.target }}" in
            staging|production) ;;
            *) echo "Invalid target: ${{ inputs.target }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Recheck Staging ownership before pushing
        if: inputs.target == 'staging' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        # The job may have waited on the concurrency group; the PR can have closed,
        # released the label, or moved to a new commit since `check-lock` ran.
        run: |
          set -euo pipefail
          REASON=$(.github/scripts/check-staging-holder.sh "$PR" "$SOURCE_SHA" | sed -n 's/^reason=//p')
          if [[ -n "$REASON" ]]; then
            echo "::error::$REASON; refusing to modify Staging."
            exit 1
          fi

      - name: Push migrations
        id: push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Both values come from the "${{ inputs.target }}" environment; never fall back to another project.
          if [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Missing SUPABASE_PROJECT_REF or DB_PASSWORD in the ${{ inputs.target }} environment."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"
