name: _db_migrate

on:
  workflow_call:
    inputs:
      target:
        description: "staging or production"
        required: true
        type: string
    outputs:
      migrate_status:
        description: "Outcome of the migration push step (success/failure)"
        value: ${{ jobs.migrate.outputs.migrate_status }}

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    outputs:
      migrate_status: ${{ steps.push.outcome }}

    steps:
      - name: Validate target
        run: |
          case "${{ inputs.target }}" in
            staging|production) ;;
            *) echo "Invalid target: ${{ inputs.target }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Push migrations
        id: push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.target == 'production' && vars.PROD_PROJECT_REF || vars.STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ inputs.target == 'production' && secrets.PROD_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"
