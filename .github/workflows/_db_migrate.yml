name: _db_migrate

on:
  workflow_call:
    inputs:
      target:
        description: "production"
        required: true
        type: string
    outputs:
      migrate_status:
        description: "Outcome of the migration push step (success/failure)"
        value: ${{ jobs.migrate.outputs.migrate_status }}

permissions:
  contents: read
  pull-requests: read

jobs:
  migrate:
    name: Push migrations (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    # Serialize `db push` across every caller.
    concurrency:
      group: db-migrate-${{ inputs.target }}
      cancel-in-progress: false
    outputs:
      migrate_status: ${{ steps.push.outcome }}

    steps:
      - name: Validate target
        run: |
          case "${{ inputs.target }}" in
            production) ;;
            *) echo "Invalid target: ${{ inputs.target }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Push migrations
        id: push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Both values come from the "${{ inputs.target }}" environment; never fall back to another project.
          if [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Missing SUPABASE_PROJECT_REF or DB_PASSWORD in the ${{ inputs.target }} environment."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"
