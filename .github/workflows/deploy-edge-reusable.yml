name: Deploy complete Edge bundles
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      function_names:
        type: string
        default: ""
      base_revision:
        type: string
        default: ""
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: edge-deploy-${{ inputs.environment }}
  # Production deployments finish in order.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_REF: ${{ vars.PROD_PROJECT_REF }}
      DEPLOY_ENV: ${{ inputs.environment }}
      DEPLOY_FUNCTIONS: ${{ inputs.function_names }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BOOTSTRAP_BEFORE: ${{ inputs.base_revision }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Require current environment revision and resolve complete range
        id: revision
        run: |
          set -euo pipefail
          BRANCH=main
          git fetch origin "$BRANCH" --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/$BRANCH)" ]; then
            echo "::error::This revision is no longer the environment head. Run the current revision."
            exit 1
          fi
          BEFORE=$(git rev-parse --verify "refs/tags/edge-deployed-$DEPLOY_ENV^{commit}" 2>/dev/null || true)
          if [ -z "$BEFORE" ] && [ "$DEPLOY_ENV" = production ] && [ -z "$DEPLOY_FUNCTIONS" ]; then
            if [ -z "$BOOTSTRAP_BEFORE" ] || ! git cat-file -e "$BOOTSTRAP_BEFORE^{commit}" 2>/dev/null; then
              echo "::error::Production initialization requires the previous deployed push revision."
              exit 1
            fi
            git merge-base --is-ancestor "$BOOTSTRAP_BEFORE" HEAD
            BEFORE=$BOOTSTRAP_BEFORE
          fi
          echo "DEPLOY_BEFORE=$BEFORE" >> "$GITHUB_ENV"
      - name: Guard tests
        run: node --test scripts/edge-deploy-plan.test.mjs scripts/deploy-edge.test.mjs supabase/functions/_shared/staging-outbound.test.mjs supabase/functions/_shared/staging-whatsapp-test.test.ts
      - name: Deploy complete source bundles
        run: |
          set -euo pipefail
          FUNCTIONS=$(node scripts/edge-deploy-plan.mjs)
          node scripts/deploy-edge.mjs "$DEPLOY_ENV" $FUNCTIONS
      - name: Record successful revision
        if: inputs.function_names == ''
        run: |
          set -euo pipefail
          git tag -f "edge-deployed-$DEPLOY_ENV" "$SOURCE_SHA"
          git push origin "refs/tags/edge-deployed-$DEPLOY_ENV" --force
          echo "### $DEPLOY_ENV Edge revision: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
