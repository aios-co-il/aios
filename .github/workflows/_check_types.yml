name: _check_types

# Fails when the committed Supabase types differ from what the migrations generate.
# Builds a throwaway local database from supabase/migrations and the dev seed, so it
# needs no secrets, never touches a hosted project, and sees a PR's own migrations.
# Called by ci-frontend.yml when migrations or the generated types change.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-types:
    name: Check Supabase types match migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local database (migrations and seed)
        run: supabase db start

      - name: Generate types from the local schema
        run: |
          # Invoke the pinned CLI directly: scripts/gen-types.sh is PR code and uses the repo's pnpm install.
          supabase gen types typescript --local > src/integrations/supabase/types.ts
          npx --yes prettier@3.9.9 --log-level warn --write src/integrations/supabase/types.ts
          cp src/integrations/supabase/types.ts supabase/functions/_shared/database.types.ts

      - name: Fail if committed types are stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "::error::Generated Supabase types differ from the committed ones. Run ./scripts/gen-types.sh --local after 'supabase db start' and commit both generated files."
            exit 1
          fi

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
