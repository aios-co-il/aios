# History stays linear on `main` and `develop`, so nothing merges main into develop.
# A hotfix lands on `main` first, then is cherry-picked onto `develop` in its own PR.
# This check fails when a `main` commit has no patch-equivalent on `develop`, i.e. the
# hotfix was not ported yet and Staging lags Production.

name: Check develop has main

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-develop-from-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on main commits missing from develop
        run: |
          set -euo pipefail
          git fetch origin develop main
          # `git cherry` marks commits with no patch-equivalent upstream with "+".
          missing=$(git cherry origin/develop origin/main | grep '^+' || true)
          if [ -n "$missing" ]; then
            echo "::error::main has commits with no equivalent on develop. Cherry-pick them onto develop in a PR:"
            echo "$missing" | while read -r _ sha; do git log -1 --format='  %h %s' "$sha"; done
            exit 1
          fi
          echo "develop contains every main change"
