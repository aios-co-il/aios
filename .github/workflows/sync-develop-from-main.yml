# Keep Staging (`develop`) on the newest code.
# Normal release flow is still feature → develop → main.
# After a merge/hotfix lands on `main`, Staging must not lag — auto-merge main → develop.
# Also available manually for emergency backports.

name: Sync develop from main

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-develop-from-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into develop
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already contains main — Staging is current"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor HEAD origin/main; then
            git merge --ff-only origin/main
          else
            git merge --no-edit -m "chore: sync develop from main (keep Staging current)" origin/main
          fi
          git push origin HEAD:develop
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Staging (develop) updated from main"

  staging-edge:
    needs: sync
    uses: ./.github/workflows/deploy-staging-develop.yml
    with:
      source_sha: ${{ needs.sync.outputs.sha }}
    secrets: inherit

  staging-build:
    needs: sync
    uses: ./.github/workflows/ci-frontend.yml
    with:
      source_sha: ${{ needs.sync.outputs.sha }}
    secrets: inherit
