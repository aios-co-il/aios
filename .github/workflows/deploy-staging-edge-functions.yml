name: Deploy Staging Edge Functions
permissions:
  contents: write

on:
  push:
    branches: [develop]
    paths:
      [
        "supabase/functions/**",
        "supabase/config.toml",
        "supabase/ops/*staging*.sql",
        "scripts/*edge*",
        "scripts/*staging*",
        ".github/workflows/deploy*edge*.yml",
      ]
  workflow_dispatch:
    inputs:
      function_name:
        description: "Function names; empty reconciles all changes since last successful deployment"
        type: string
        default: ""
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
jobs:
  deploy:
    uses: ./.github/workflows/deploy-edge-reusable.yml
    with:
      environment: staging
      source_sha: ${{ inputs.source_sha || github.sha }}
      function_names: ${{ inputs.function_name || '' }}
    secrets: inherit
