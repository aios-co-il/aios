name: Pulse delivery test now

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "dmm | marketingcaptain | both"
        required: true
        default: both
        type: choice
        options:
          - both
          - dmm
          - marketingcaptain
      preview_only:
        description: "Preview only (no campaigner sends)"
        required: true
        default: false
        type: boolean

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PROJECT_REF: zvoijyneresvkadpprel
      SUPABASE_URL: https://zvoijyneresvkadpprel.supabase.co
      DMM_TENANT: 6ad8f321-25db-4a04-8e44-e57a7c8961b2
      MC_TENANT: 2dcdaac6-41bf-42cc-86bf-9a0b4b2e6019
    steps:
      - name: Resolve production service key
        shell: bash
        run: |
          set -euo pipefail
          KEYS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys")"
          SERVICE_KEY="$(jq -r '.[] | select(.name == "service_role") | .api_key' <<<"$KEYS")"
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "Could not resolve the service_role key" >&2
            exit 1
          fi
          echo "::add-mask::$SERVICE_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"

      - name: Trigger campaign pulse delivery
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW="${{ inputs.preview_only }}"
          PREVIEW_JSON="false"
          if [ "$PREVIEW" = "true" ]; then PREVIEW_JSON="true"; fi

          send_tenant() {
            local TENANT_ID="$1"
            local LABEL="$2"
            echo "=== Pulse test: $LABEL ($TENANT_ID) preview_only=$PREVIEW_JSON ==="
            curl --fail --silent --show-error -X POST \
              "$SUPABASE_URL/functions/v1/campaign-pulse-snapshot" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"tenant_id\":\"$TENANT_ID\",\"deliver\":true,\"force_delivery\":true,\"preview_only\":$PREVIEW_JSON,\"source\":\"approved_manual_trigger\"}" \
              | tee "/tmp/pulse-test-$LABEL.json"
            echo
          }

          case "${{ inputs.tenant }}" in
            dmm) send_tenant "$DMM_TENANT" "dmm" ;;
            marketingcaptain) send_tenant "$MC_TENANT" "mc" ;;
            both)
              send_tenant "$DMM_TENANT" "dmm"
              send_tenant "$MC_TENANT" "mc"
              ;;
            *) echo "Unknown tenant input" >&2; exit 1 ;;
          esac
