name: Pulse David sample (MarketingCaptain only)

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PROJECT_REF: zvoijyneresvkadpprel
      SUPABASE_URL: https://zvoijyneresvkadpprel.supabase.co
      MC_TENANT: 2dcdaac6-41bf-42cc-86bf-9a0b4b2e6019
      DAVID_PHONE: "972507677613"
    steps:
      - name: Resolve production service key
        shell: bash
        run: |
          set -euo pipefail
          KEYS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys")"
          SERVICE_KEY="$(jq -r '.[] | select(.name == "service_role") | .api_key' <<<"$KEYS")"
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "Could not resolve the service_role key" >&2
            exit 1
          fi
          echo "::add-mask::$SERVICE_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"

      - name: Send one sample pulse digest to David only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 300 -X POST \
            "$SUPABASE_URL/functions/v1/campaign-pulse-snapshot" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"tenant_id\":\"$MC_TENANT\",\"deliver\":true,\"force_delivery\":true,\"source\":\"approved_manual_trigger\",\"sample_to_phone\":\"$DAVID_PHONE\"}" \
            | tee /tmp/pulse-david-sample.json
          echo
          jq -e '.success == true and (.results[0].scoped_deliveries[]? | select(.type==\"sample\" and .queued==true))' /tmp/pulse-david-sample.json
