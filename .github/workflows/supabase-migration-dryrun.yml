name: Supabase migration dry run

# Read-only: compares supabase/migrations with the target project's migration
# history so drift can be spotted before relying on the automatic pipeline.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging or prod"
        required: true
        type: choice
        options: [staging, prod]
  # TEMPORARY: lets the dry run execute from the PR before this file reaches main.
  pull_request:
    paths: [.github/workflows/supabase-migration-dryrun.yml]

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry run (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || '["staging","prod"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.target == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: List history and dry-run push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          TARGET: ${{ matrix.target }}
          PROD_REF: ${{ vars.PROD_PROJECT_REF }}
          STAGING_REF: ${{ vars.STAGING_PROJECT_REF }}
          PROD_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          STAGING_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Pick the target's own settings; never fall back to the other project.
          if [ "$TARGET" = prod ]; then
            PROJECT_REF="$PROD_REF"; DB_PASSWORD="$PROD_PASSWORD"
          else
            PROJECT_REF="$STAGING_REF"; DB_PASSWORD="$STAGING_PASSWORD"
          fi
          if [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Missing project ref or database password for $TARGET."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase migration list --password "$DB_PASSWORD"
          supabase db push --dry-run --password "$DB_PASSWORD"
