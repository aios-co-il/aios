name: Deploy Supabase Edge Function
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      [
        "supabase/functions/**",
        "supabase/config.toml",
        "scripts/*edge*",
        "scripts/staging-only-functions.json",
        ".github/workflows/deploy*edge*.yml",
      ]
  workflow_dispatch:
    inputs:
      function_name:
        description: "Function names; empty reconciles all changes since last successful deployment"
        type: string
        default: ""
jobs:
  deploy:
    uses: ./.github/workflows/deploy-edge-reusable.yml
    with:
      environment: production
      source_sha: ${{ github.sha }}
      function_names: ${{ inputs.function_name || '' }}
      base_revision: ${{ github.event.before || '' }}
    secrets: inherit
