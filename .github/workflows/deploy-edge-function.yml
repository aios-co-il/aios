name: Deploy Supabase Edge Function

# Manual only. Production migrations and declared functions deploy through the Supabase
# GitHub integration; use this for functions not declared in supabase/config.toml.
permissions:
  contents: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: "Function names; empty reconciles all changes since last successful deployment"
        type: string
        default: ""
jobs:
  deploy:
    uses: ./.github/workflows/deploy-edge-reusable.yml
    with:
      environment: production
      source_sha: ${{ github.sha }}
      function_names: ${{ inputs.function_name || '' }}
      base_revision: ${{ github.event.before || '' }}
    secrets: inherit
