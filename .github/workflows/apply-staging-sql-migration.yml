name: Apply SQL migration — Staging

# Applies supabase/ops/*.sql to the STAGING Supabase project only.
# Production stays in apply-sql-migration.yml (main).

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Path to SQL file under the repo'
        required: true
        default: 'supabase/ops/apply_connect_client_meta_ad_account_skin.sql'
      migration_name:
        description: 'Migration name recorded in Supabase'
        required: true
        default: 'apply_connect_client_meta_ad_account_skin'
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-staging-sql-migration.yml'
      - 'supabase/ops/apply_connect_client_meta_ad_account_skin.sql'
      - 'supabase/ops/apply_carmen_autonomous_goal_engine_staging.sql'
      - 'supabase/ops/apply_goal_execution_and_autonomous_engine_staging.sql'
      - 'supabase/ops/apply_pulse_campaign_breakdown_staging.sql'
      - 'supabase/ops/apply_recurring_human_tasks_staging.sql'
      - 'supabase/ops/apply_marketing_assets_type_staging.sql'
      - 'supabase/ops/apply_client_retention_daily_staging.sql'
      - 'supabase/ops/apply_seo_geo_workflow_staging.sql'
      - 'supabase/ops/merge_duplicate_user_campaigners_staging.sql'
      - 'supabase/ops/merge_same_email_campaigners_staging.sql'
      - 'supabase/ops/merge_assigned_campaigner_staging.sql'
      - 'supabase/ops/apply_lead_status_updates_staging.sql'

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_ID || 'mzjsuvatrzhciojmbbbm' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so github.event.before is resolvable for path diffs.
          fetch-depth: 0

      - name: Resolve SQL file
        id: sql
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ github.event.inputs.sql_file }}"
            NAME="${{ github.event.inputs.migration_name }}"
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              DIFF="$(git show --pretty=format: --name-only "$SHA" | sort -u || true)"
            else
              DIFF="$(git diff --name-only "$BEFORE" "$SHA" | sort -u || true)"
            fi
            echo "Changed files (staging ops resolve):"
            echo "$DIFF" | grep '^supabase/ops/' || true
            CHANGED="$(echo "$DIFF" | grep '^supabase/ops/.*staging.*\.sql$' || true)"
            if [ -z "$CHANGED" ]; then
              echo "No staging ops SQL changed in this push; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            FILE="$(echo "$CHANGED" | head -1)"
            NAME="$(basename "$FILE" .sql)"
          fi
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Apply via /database/migrations (Staging)
        if: steps.sql.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys, urllib.error, urllib.request

          path = os.environ["SQL_FILE"]
          name = os.environ["MIG_NAME"]
          query = pathlib.Path(path).read_text()
          body = json.dumps({"query": query, "name": name}).encode()
          url = f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/migrations"
          headers = {
              "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "aios-apply-staging-sql-migration/1.0",
              "Accept": "application/json",
          }
          req = urllib.request.Request(url, data=body, headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=180) as resp:
                  raw = resp.read().decode()
                  print(f"HTTP {resp.status}")
                  print(raw[:4000])
          except urllib.error.HTTPError as e:
              raw = e.read().decode()
              print(f"HTTP {e.code}", file=sys.stderr)
              print(raw[:4000], file=sys.stderr)
              sys.exit(1)
          PY
        env:
          SQL_FILE: ${{ steps.sql.outputs.file }}
          MIG_NAME: ${{ steps.sql.outputs.name }}
