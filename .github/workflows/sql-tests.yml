name: CI — SQL tests

# Runs every supabase/tests/*.sql against a throwaway local Supabase database
# built from supabase/migrations and the dev seed. No secrets: the job never
# links or connects to a hosted project.
on:
  pull_request:
    branches: [main, develop]
  # develop is covered by pull_request and its merge queue, which test the same content.
  push:
    branches: [main]
  # develop's merge queue: each queued PR is checked on top of the PRs ahead of it.
  merge_group:

concurrency:
  group: sql-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sql-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A PR over GitHub's 3000-file listing cap may be truncated, so it runs everything.
      sql: ${{ github.event.pull_request.changed_files >= 3000 && 'true' || steps.filter.outputs.sql || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pushes have no base, so this step skips and the output defaults to true.
      # PRs use the API; merge-queue runs diff against the queue's base SHA.
      - id: filter
        if: github.event.pull_request || github.event.merge_group
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            sql:
              - "supabase/**"
              - ".github/workflows/sql-tests.yml"

  sql-tests:
    needs: sql-changes
    # always() so a failed detection job runs the tests instead of skipping this required check.
    if: always() && (needs.sql-changes.result != 'success' || needs.sql-changes.outputs.sql == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local database (migrations and seed)
        run: supabase db start

      - name: Run supabase/tests/*.sql
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -uo pipefail
          failed=()
          for test in supabase/tests/*.sql; do
            echo "::group::$test"
            if psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$test"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$test::$test failed"
              failed+=("$test")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} SQL test(s) failed: ${failed[*]}"
            exit 1
          fi

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
