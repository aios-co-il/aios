<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>AIOS — כרמן</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="panel">
    <header class="panel-bar">
      <div id="tab-controls" class="tab-controls hidden">
        <div id="tab-chip" class="tab-chip"></div>
        <label class="checkbox">
          <input type="checkbox" id="share-tab" />
          כרמן רואה את הלשונית
        </label>
      </div>
      <a id="open-site" class="link" target="_blank" rel="noopener"
        >פתיחה בלשונית</a
      >
    </header>
    <div id="signin-notice" class="panel-notice hidden">
      כדי לדבר עם כרמן כאן, התחברו ב-popup של התוסף (הסמל של AIOS בסרגל הכלים)
      ובחרו ארגון, ואז סגרו ופתחו את החלונית מחדש.
    </div>
    <div id="frame-notice" class="panel-notice hidden">
      כרמן לא ענתה בחלונית. אם אתם כבר מחוברים ל-AIOS, סגרו ופתחו את החלונית
      מחדש. אם לא,
      <a id="notice-link" target="_blank" rel="noopener">פתחו את AIOS בלשונית</a
      >, התחברו שם, ואז פתחו את החלונית מחדש.
    </div>
    <div
      id="grant-card"
      class="grant-card hidden"
      role="dialog"
      aria-labelledby="grant-title"
    >
      <div id="grant-title" class="grant-title"></div>
      <!-- The words come from src/device/cardWords.ts, per step. -->
      <p id="grant-text" class="grant-text"></p>
      <div class="grant-actions">
        <button id="grant-allow" class="btn primary" type="button"></button>
        <button id="grant-decline" class="btn secondary" type="button">
          לא עכשיו
        </button>
      </div>
    </div>
    <iframe
      id="carmen-frame"
      class="panel-frame hidden"
      title="כרמן"
      allow="microphone"
    ></iframe>

    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
