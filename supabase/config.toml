[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:*/**", "http://127.0.0.1:*/**"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true # Required for local sign-in with Google auth
redirect_uri = "http://localhost:54321/auth/v1/callback"

# Production has Twilio SMS enabled and branches would inherit it. Keep it off so a branch never sends real SMS.
[auth.sms.twilio]
enabled = false

