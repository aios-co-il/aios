[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:*/**",
  "http://127.0.0.1:*/**",
  "https://*.vercel.app/**",
]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true                                  # Required for local sign-in with Google auth
redirect_uri = "http://localhost:54321/auth/v1/callback"

# Values come from supabase/.env.preview on branches (APP_ENV=preview keeps the outbound guard on)
# and from supabase/.env.production on Production.
# Secrets are encrypted in those files; the private keys (supabase/.env.keys) are never committed.
[edge_runtime.secrets]
APP_ENV = "env(APP_ENV)"
STAGING_SAFE_MODE = "env(STAGING_SAFE_MODE)"
CRON_SECRET = "env(CRON_SECRET)"
CAMPAIGN_PULSE_CRON_SECRET = "env(CAMPAIGN_PULSE_CRON_SECRET)"
REPORT_WORKER_SECRET = "env(REPORT_WORKER_SECRET)"
GOAL_BRAIN_CALLBACK_SECRET = "env(GOAL_BRAIN_CALLBACK_SECRET)"
AGENT_CHANNEL_CALLBACK_SECRET = "env(AGENT_CHANNEL_CALLBACK_SECRET)"
WEBHOOK_LEAD_INTAKE_SECRET = "env(WEBHOOK_LEAD_INTAKE_SECRET)"
WEBHOOK_TASK_INTAKE_SECRET = "env(WEBHOOK_TASK_INTAKE_SECRET)"
GOOGLE_CLIENT_ID = "env(GOOGLE_CLIENT_ID)"
GOOGLE_CLIENT_SECRET = "env(GOOGLE_CLIENT_SECRET)"


# Production overrides. Every branch, including `develop`, uses the base config above;
# Production keeps its live Auth values (read from the live project on 2026-10-22); its secrets come from .env.production.
[remotes.production]
project_id = "zvoijyneresvkadpprel"

[remotes.production.auth]
site_url = "https://aios.co.il"
additional_redirect_urls = ["https://aios.co.il", "https://*.aios.co.il"]

[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.production.auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[remotes.production.auth.external.google]
skip_nonce_check = false
redirect_uri = "https://zvoijyneresvkadpprel.supabase.co/auth/v1/callback"


