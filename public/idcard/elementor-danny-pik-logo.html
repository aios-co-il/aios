  function whenBackFromShare() {
    return new Promise(function (resolve) {
      var sawHidden = document.visibilityState === "hidden";
      var settled = false;
      var earlyTimer = 0;
      function finish() {
        if (settled) return;
        settled = true;
        document.removeEventListener("visibilitychange", onChange);
        window.clearTimeout(earlyTimer);
        window.setTimeout(resolve, 200);
      }
      function onChange() {
        if (document.visibilityState === "hidden") {
          sawHidden = true;
          window.clearTimeout(earlyTimer);
          return;
        }
        if (sawHidden) finish();
      }
      document.addEventListener("visibilitychange", onChange);
      earlyTimer = window.setTimeout(function () {
        if (!sawHidden && document.visibilityState === "visible") finish();
      }, 800);

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = src;
    });

    var logo = document.querySelector(".brand-logo");

      lw = lh * ratio;
    }
    ctx.drawImage(logo, right - lw, top, lw, lh);
    var textRight = right - Math.round(lw * 0.204);
    var nameY = top + lh + 26;
    ctx.fillStyle = "#0f4c81";
    ctx.textAlign = "right";
    ctx.direction = "rtl";
    ctx.font = "700 28px Heebo, sans-serif";
    ctx.fillText("דני פיק | יו\"ר", textRight, nameY);
    var lineY = nameY + 12;
    ctx.fillStyle = "#c4a574";
    ctx.fillRect(textRight - 56, lineY, 56, 4);
    ctx.fillStyle = "#0f4c81";
    ctx.direction = "ltr";
    ctx.font = "800 58px Heebo, sans-serif";
    ctx.fillText("052-3795155", textRight, lineY + 64);
    ctx.font = "800 40px Heebo, sans-serif";
    ctx.fillText("danny@pdpsagot.co.il", textRight, lineY + 122);
    var blob = await new Promise(function (resolve) { canvas.toBlob(resolve, "image/jpeg", 0.9); });
    return new File([blob], "danny-pik-logo.jpg", { type: "image/jpeg" });
  }

  document.querySelectorAll(".js-share-card").forEach(function (link) {
    link.addEventListener("click", async function (event) {
      event.preventDefault();
      var file;
      try { file = await cardFile(); } catch (err) { file = null; }
      var text = shareText();
      var android = /Android/i.test(navigator.userAgent || "");
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], text: text });
          if (android) {
            await whenBackFromShare();
            openWhatsAppText(text);
          }
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      openWhatsAppText(text);
    });
  });
})();
</script>
